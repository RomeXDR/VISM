name: Build VISM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
            executable: VISaveManager
            extension: tar.gz
          - runner: windows-2025
            rid: win-x64
            executable: VISaveManager.exe
            extension: zip

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Install NativeAOT build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT build
        run: dotnet publish VISaveManager.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:TreatWarningsAsErrors=true -o dist/publish

      - name: Verify published files
        shell: pwsh
        run: |
          $required = @('${{ matrix.executable }}')
          if ($IsLinux) {
            $required += @('ui/index.html', 'ui/app.js', 'team-saves/Start/about.txt')
          } else {
            $extra = @(Get-ChildItem -LiteralPath dist/publish | Where-Object { $_.Name -notin @('VISaveManager.exe', 'VISaveManager.pdb') })
            if ($extra.Count) { throw "Windows publish contains unexpected sidecar files: $($extra.Name -join ', ')" }
          }
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath "dist/publish/$path" -PathType Leaf)) {
              throw "Missing published file $path"
            }
          }

          foreach ($managedRuntimeFile in @('VISaveManager.dll', 'coreclr.dll', 'libcoreclr.so', 'clrjit.dll', 'libclrjit.so')) {
            if (Test-Path -LiteralPath "dist/publish/$managedRuntimeFile") {
              throw "Unexpected managed build file $managedRuntimeFile"
            }
          }

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          test -x dist/publish/VISaveManager
          dist/publish/VISaveManager --help
          tar --exclude='./VISaveManager.dbg' -czf dist/VISaveManager-linux-x64.tar.gz -C dist/publish .

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath 'dist/publish/VISaveManager.exe' -DestinationPath 'dist/VISaveManager-win-x64.zip'

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: VISaveManager-${{ matrix.rid }}
          path: dist/VISaveManager-${{ matrix.rid }}.${{ matrix.extension }}
          if-no-files-found: error

      - name: Check the Windows WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clientId = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$clientId",
                    "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$clientId")
          $versions = @(Get-ItemPropertyValue -Path $keys -Name pv -ErrorAction SilentlyContinue)
          if (!$versions.Where({ $_ -as [version] -gt [version]'0.0.0.0' })) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') {
              throw 'WebView2 bootstrapper signature validation failed'
            }
            $installation = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($installation.ExitCode) { throw "WebView2 bootstrapper returned $($installation.ExitCode)" }
            $versions = @(Get-ItemPropertyValue -Path $keys -Name pv -ErrorAction SilentlyContinue)
          }
          Write-Host "WebView2 runtime versions: $versions"

      - name: Test Windows WebView2 save load
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: |
          Expand-Archive -LiteralPath dist/VISaveManager-win-x64.zip -DestinationPath dist/windows-smoke
          node tests/windows-nativeaot-smoke.mjs dist/windows-smoke
